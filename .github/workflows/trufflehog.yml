name: TruffleHog Secret Verification

# PORTABLE TEMPLATE — copy into <your-repo>/.github/workflows/trufflehog.yml
# as-is. Adapted from mapup-security-team/.github/workflows/trufflehog.yml
# (DefectDojo upload is an inline curl here instead of that repo's local
# helper script).
#
# Distinct from gitleaks: gitleaks pattern-matches for secret-shaped
# strings, TruffleHog additionally calls each provider's own API (e.g. AWS
# GetCallerIdentity) to confirm whether a matched credential is still live.
# Runbook §4.2: requires approval per §1.1/§1.2 before running against any
# sensitive-classified repo, since verification makes real outbound calls.
#
# Optional secrets (steps skip gracefully when unset):
#   DEFECTDOJO_URL, DEFECTDOJO_API_KEY - findings upload
#   GCHAT_WEBHOOK_URL                  - failure alerts

on:
  # No branch filter: repos differ in default-branch names, so scan PRs
  # into any branch rather than assuming main/master/develop.
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual secret verification scan"

jobs:
  trufflehog:
    name: Verify secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Install TruffleHog
        env:
          # Pinned release instead of `curl | sh`, so a compromised install
          # script or hijacked URL cannot execute code on the runner.
          # When bumping the version, update all four values together.
          TRUFFLEHOG_VERSION: "3.97.0"
          TRUFFLEHOG_SHA256: "62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4"
          # Sigstore identity of the upstream release workflow that signs the
          # checksum file — proves the artifact came from TruffleHog's own
          # release pipeline, not just that the download arrived intact.
          TRUFFLEHOG_CERT_IDENTITY: "https://github.com/trufflesecurity/trufflehog/.github/workflows/release.yml@refs/tags/v3.97.0"
          TRUFFLEHOG_CERT_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          checksums="trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          workdir="$(mktemp -d)"

          for f in "$archive" "$checksums" "$checksums.sig" "$checksums.pem"; do
            curl -sSfL -o "$workdir/$f" "$base/$f"
          done

          # 1. The checksum file is signed by the upstream release workflow.
          cosign verify-blob \
            --certificate "$workdir/$checksums.pem" \
            --signature "$workdir/$checksums.sig" \
            --certificate-identity "$TRUFFLEHOG_CERT_IDENTITY" \
            --certificate-oidc-issuer "$TRUFFLEHOG_CERT_OIDC_ISSUER" \
            "$workdir/$checksums"

          # 2. The tarball matches that signed checksum file...
          (cd "$workdir" && grep " ${archive}\$" "$checksums" | sha256sum -c -)

          # 3. ...and the digest recorded here, so a careless version bump
          #    can't silently pull a different binary.
          (cd "$workdir" && echo "${TRUFFLEHOG_SHA256}  ${archive}" | sha256sum -c -)

          tar -xzf "$workdir/$archive" -C "$workdir" trufflehog
          sudo install -m 0755 "$workdir/trufflehog" /usr/local/bin/trufflehog
          rm -rf "$workdir"
          trufflehog --version

      - name: Run TruffleHog
        run: |
          # Retain verified, unknown, AND unverified findings per runbook §4.2
          # — triage unknown/unverified rather than discarding them.
          trufflehog git file://. \
            --results=verified,unknown,unverified \
            --json \
            --fail-on-scan-errors > trufflehog-report.json || true

      - name: Upload to DefectDojo
        if: always()
        env:
          DOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          if [ -z "$DOJO_URL" ] || [ -z "$DOJO_API_KEY" ]; then
            echo "DEFECTDOJO_URL/DEFECTDOJO_API_KEY not set — skipping upload."
            exit 0
          fi
          if [ ! -s trufflehog-report.json ]; then
            echo "No TruffleHog output to upload."
            exit 0
          fi
          curl -sS -X POST "$DOJO_URL/api/v2/reimport-scan/" \
            -H "Authorization: Token $DOJO_API_KEY" \
            -F "product_name=${{ github.event.repository.name }}" \
            -F "product_type_name=Research and Development" \
            -F "engagement_name=CI Secret Verification" \
            -F "scan_type=Trufflehog Scan" \
            -F "auto_create_context=True" \
            -F "close_old_findings=True" \
            -F "push_to_jira=False" \
            -F "active=True" \
            -F "verified=True" \
            -F "group_by=finding_title" \
            -F "file=@trufflehog-report.json"

      - name: Archive TruffleHog report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Send Google Chat Alert on Failure
        if: failure()
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: |
          if [ -z "$GCHAT_WEBHOOK_URL" ]; then
            echo "GCHAT_WEBHOOK_URL not set — skipping alert."
            exit 0
          fi
          curl -sS -X POST "$GCHAT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"text": "🚨 [Critical] TruffleHog: verified secret detected in ${{ github.repository }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
